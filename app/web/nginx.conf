# nginx for the `web` service: the production build at /, and every request under /api passed,
# path unchanged, to the API inside the Compose network, so the browser reaches the API only
# through this origin (blueprint 5.4). The whole configuration, not a server block, because nginx
# runs as a non-root user: its pid file and temporary files live in /tmp and it listens on 8080.
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # The API's `app.access` line is the only request log (blueprint 5.4).
    access_log off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
