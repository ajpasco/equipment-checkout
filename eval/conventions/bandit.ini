# bandit's configuration for the conventions step (eval/conventions.sh). Read-only to every builder.
#
# Passed with --ini. Without it bandit looks for a .bandit file in the folders it scans and takes
# skipped tests from it, so a builder's .bandit under app/ would switch tests off; with it, this is
# the only configuration bandit reads (checked: a .bandit under app/ naming skips is ignored).
#
# Every test bandit 1.8.3 has, at every severity: no test is skipped. It ran clean on the trunk's
# app/ when it joined the step. A `# nosec` comment still silences a line; each one is a departure
# that the builder names in its handoff and the fresh reader reports (docs/TECH-SPEC.md, section 14).
#
# What a builder's machine may hold that the gate's copy never does (installed packages, virtual
# environments, a local build) is not the builder's code and is not scanned.

[bandit]
exclude = */node_modules/*,*/.venv/*,*/venv/*,*/dist/*
