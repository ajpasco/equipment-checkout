# The exam's whole stack, for the browser (B) and journey (J) rows. Owned by the exam, never by a
# builder.
#
# Started by eval/run.sh as
#   docker compose -p <run> -f eval/stack/compose.yml --env-file eval/e2e/eval.env up -d --build --wait
# and stopped and started again by the production rows (eval/e2e/support/stack.js) with the same
# file, project and env file.
#
# Three services, in the shape the blueprint gives the real stack (TECH-SPEC section 6 and 9.1):
#   db   PostgreSQL 16, its data on a named volume, so a `down` without -v keeps what was committed
#        and a `down -v` is a first start. Not published.
#   api  the tree's app/api, run the way eval/compose.yml runs it. Not published.
#   web  the tree's app/web, built for production inside a container and served by nginx, which
#        sends /api to the api service. The only published port: WEB_PORT from the env file, on
#        the loopback.
#
# Nothing from app/ runs on the machine that holds the exam: `npm ci`, any install script the
# builder writes, and Vite all run inside the `web` image's first stage. The exam decides how the
# client is built (its own `vite build` with `--outDir`, so a builder's vite.config.js cannot move
# the output) and how it is served (eval/stack/nginx.conf); the builder decides what it contains.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set by eval/e2e/eval.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set by eval/e2e/eval.env}
      POSTGRES_DB: ${POSTGRES_DB:?set by eval/e2e/eval.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build:
      context: ../../app/api
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /srv/api
        COPY requirements.txt ./
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set by eval/e2e/eval.env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The readiness probe blueprint DD-04 names for Compose: the user list as user 1.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/users', headers={'X-User-Id': '1'}), timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
  web:
    build:
      context: ../../app/web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      # A node_modules or dist folder left in a builder's working copy is removed before the
      # install, so the image never runs a dependency built for another machine.
      dockerfile_inline: |
        FROM node:22-slim AS build
        WORKDIR /src
        COPY . .
        RUN rm -rf node_modules dist && npm ci
        ARG VITE_API_BASE_URL
        ENV VITE_API_BASE_URL=$VITE_API_BASE_URL
        RUN node_modules/.bin/vite build --outDir /built --emptyOutDir
        FROM nginx:1.27-alpine
        COPY --from=build /built /usr/share/nginx/html
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  db-data:
