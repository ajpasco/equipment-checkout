# How the exam's stack serves the web client (eval/stack/compose.yml, service `web`). Owned by the
# exam. The shape is the blueprint's: the production build at /, and every request under /api
# passed, path unchanged, to the API inside the Compose network, which is not published.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
