name: pod-preview
# Started by a person with write access, never by a pull request: pod-works preview <pr>
# dispatches it on main. workflow_dispatch runs the workflow file from the ref it is dispatched
# on, so this file and preview.sh are always main's copies; the pull request's own .github/ never
# runs. It runs the pull request's acceptance tests against main's app/ and writes nothing to
# GitHub: the result is this job's conclusion and its log, and pod-works records it as a
# pod/preview status with the founder's own login. Information before approving, not a condition
# of the gate.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: pull request number
        type: string
        required: true
permissions: {}
jobs:
  preview-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_INPUT: ${{ inputs.pr }}
        run: |
          case "$PR_INPUT" in ''|*[!0-9]*) echo "pod-preview: '$PR_INPUT' is not a pull request number"; exit 1;; esac
          state=$(gh pr view "$PR_INPUT" --repo "$GITHUB_REPOSITORY" --json state -q .state)
          if [ "$state" != "OPEN" ]; then echo "pod-preview: #$PR_INPUT is $state; only an open pull request is previewed"; exit 1; fi
          sha=$(gh pr view "$PR_INPUT" --repo "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          ref=$(gh pr view "$PR_INPUT" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)
          echo "number=$PR_INPUT" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: main
          path: enforcer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Chromium and the system libraries it needs, for the browser and journey rows. Installed
      # from the pull request's eval/web lockfile, since it is the pull request's acceptance tests
      # that run here, with no token in the environment; eval/run.sh then finds the browser
      # already in place.
      - name: chromium for the exam
        working-directory: subject/eval/web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: pod-preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash enforcer/.github/scripts/preview.sh "${{ steps.pr.outputs.number }}" "$GITHUB_WORKSPACE/enforcer" "$GITHUB_WORKSPACE/subject"
